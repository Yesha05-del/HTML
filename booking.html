<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="shortcut icon" href="images/India at a Glance.jpg">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .booking-form {
      max-width: 600px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    .form-title {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 600;
      color: #0d6efd;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="booking-form">
      <h3 class="form-title">Booking Form</h3>
      <form>
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" name="name" class="form-control" placeholder="Enter your name" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <input type="tel" name="number" class="form-control" placeholder="Enter your phone number" required>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Check-in Date</label>
            <input type="date" name="date" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Check-out Date</label>
            <input type="date" name="date" class="form-control" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Number of Guests</label>
          <select class="form-select" required>
            <option selected disabled>Select guests</option>
            <option>1 Guest</option>
            <option>2 Guests</option>
            <option>3 Guests</option>
            <option>4 Guests</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Special Requests</label>
          <textarea class="form-control" rows="3" placeholder="Enter any special requests"></textarea>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-block">Book Now</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
