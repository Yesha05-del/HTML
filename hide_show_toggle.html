<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <title>Document</title>
</head>
<body>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Excepturi, provident nulla saepe dolore architecto, porro ipsa dicta voluptatibus unde doloremque placeat inventore nemo minima id adipisci nostrum consequatur optio ipsam.</p>
    <button id="Hide">Hide</button>
    <button id="Show">Show</button>
    <button id="Toggle">Toggle</button>

    <script>
        $(document).ready(function(){
            $("#Hide").click(function(){
                $("p").hide()
            })
        })
          $(document).ready(function(){
            $("#Show").click(function(){
                $("p").show()
            })
        })
          $(document).ready(function(){
            $("#Toggle").click(function(){
                $("p").toggle()
            })
        })
    </script>
</body>
</html>
