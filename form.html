<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form</title>
</head>
<body>
  <h1>Personal Information Form</h1>
  <form action="">
    <label for="">Name :</label>
    <input type="text" name="name" placeholder="Enter Your Name" pattern="[A-Z]{a-z}+" required>
    <br><br>

       <label for="">Email :</label>
    <input type="email" name="Email" placeholder="Enter Your Email" required>
    <br><br>


       <label for="">Phone Number :</label>
    <input type="number" name="Phone" placeholder="Enter Your Phone" pattern="[0-9]{10}+" required>

    <br><br>

    <label for="">City :</label>
    <select name="City" id="">
      <option value="" disabled>-------City Name ---------</option>
      <option value="">Ahmedabad</option>
       <option value="" selected>Mumbai</option>
        <option value="">Surat</option>
  </select>

  <br>
  <br>
  <label for="">Gender :</label>
  <input type="radio" name="gender" value="Male"  required> Male
  <input type="radio" name="gender" value="Female" required> Female
  <br>
  <br>
 
  <label for="">Hobbies :</label>
  <input type="checkbox" name="Hobbies" value="Reading">Reading
  <input type="checkbox" name="Hobbies" value="Reading">Travelling
  <input type="checkbox" name="Hobbies" value="Reading">Listening Music
  <input type="checkbox" name="Hobbies" value="Reading">Drawing

  <br>
  <br>
  <button type="submit">Submit</button>
  </form>
</body>
</html>
