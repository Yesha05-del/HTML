<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
   <link rel="shortcut icon" href="images/India at a Glance.jpg">
</head>
<body class="bg-light">

  <!-- Container with padding and centering -->
  <div class="container p-5 d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <form action="/action_page.php" class="border p-4 rounded bg-white shadow" style="width: 300px;">
      <h4 class="text-center mb-4">Registartion</h4>

      <div class="mb-3">
        <label for="email"  class="form-label">Email:</label>
        <input type="email" name="email" class="form-control" id="email" placeholder="Enter email" name="email">
      </div>

      <div class="mb-3">
        <label for="pwd"  class="form-label">Password:</label>
        <input type="password" name="Password" class="form-control" id="pwd" placeholder="Enter password" name="pswd">
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="remember" id="remember">
        <label class="form-check-label" for="remember">Remember me</label>
      </div>

      <button type="submit" class="btn btn-primary w-100">Submit</button>
    </form>
  </div>

</body>
</html>
